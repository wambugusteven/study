<!DOCTYPE html>
<html>
    <head>
        <title>BMI Calculator</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0"/>
        
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <h1>BMI Calculator</h1>
        <div class="container">
           
            <div class="details">
               <p>BMI is actually a measure used to estimate whether a person has a healthy body weight for their height.
                It weight(kgs) divided by the square of their own height(Meters).</p>
        <div>

            <p>BMI = weight(kg) / height(m)²</p>
            <p>To show know your BMI,</p>
                <label> your weight(Kgs): <input type="number" id="weight"/></label>
                <label> your height(Meters): <input type="number" id="height"/></label>
        </div>
            </div>

             <div class="screen">
                <div>Weight:<span id="weightNo">0</span> </div>
                <div>Height:<span id="heightNo">0</span></div>
                <div>BMI:<span id="bmi-results">0</span></div>
                <div>Category:<span id="category">..</span></div>
            </div>

            <button onclick="display()">Calculate</button>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
